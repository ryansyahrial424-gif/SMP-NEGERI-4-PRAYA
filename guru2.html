<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru - SMPN 4 Praya</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-body: #f0f7ff;
      --primary: #0284c7;
      --primary-cyan: #06b6d4;
      --primary-light: #38bdf8;
      --accent-yellow: #f59e0b;
      --yellow-bright: #facc15;
      --success: #10b981;
      --danger: #ef4444;
      --dark: #0f172a;
      --card-bg: #ffffff;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { 
      background: var(--bg-body); 
      background-image: radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(250, 204, 21, 0.08) 0%, transparent 40%);
      min-height: 100vh; 
      color: var(--dark); 
      padding: 24px 16px; 
    }
    .container { max-width: 1000px; margin: 0 auto; }
    
    /* Header Banner Futuristik */
    .header-banner {
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 50%, #0284c7 100%);
      color: #ffffff;
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.25);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .header-banner::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(250, 204, 21, 0.35) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .header-banner h1 { 
      font-size: 1.6rem; 
      font-weight: 800; 
      letter-spacing: 1px; 
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header-banner h2 { 
      font-size: 1.25rem; 
      font-weight: 800; 
      margin-top: 6px; 
      color: var(--yellow-bright); 
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
    }
    .header-banner p { font-size: 0.9rem; opacity: 0.95; margin-top: 6px; font-weight: 500; }

    .card { 
      background: var(--card-bg); 
      border-radius: 20px; 
      padding: 24px; 
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08); 
      border: 1px solid rgba(56, 189, 248, 0.2); 
      margin-bottom: 24px; 
      backdrop-filter: blur(8px);
    }
    h2.card-title { font-size: 1.15rem; color: var(--primary); margin-bottom: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    h2.card-title i { color: var(--primary-cyan); }

    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { font-weight: 700; display: block; margin-bottom: 6px; font-size: 0.9rem; color: #334155; }
    .form-control { 
      width: 100%; 
      padding: 12px 16px; 
      border-radius: 14px; 
      border: 1.5px solid #cbd5e1; 
      font-size: 0.95rem; 
      outline: none; 
      transition: all 0.25s ease; 
      background: #f8fafc;
    }
    .form-control:focus { 
      border-color: var(--primary-light); 
      background: #fff;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2); 
    }
    
    .btn { 
      font-size: 0.9rem; 
      font-weight: 700; 
      padding: 12px 22px; 
      border: none; 
      border-radius: 14px; 
      cursor: pointer; 
      transition: all 0.25s ease; 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      justify-content: center; 
    }
    .btn-primary { 
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%); 
      color: #fff; 
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
    }
    .btn-primary:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
    }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-success { 
      background: linear-gradient(135deg, #059669 0%, #10b981 100%); 
      color: #fff; 
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }
    .btn-success:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
    .btn-info { 
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); 
      color: #fff; 
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }
    .btn-info:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }
    
    table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid var(--border-color); }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.875rem; }
    th { background: #f0f9ff; color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.8rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #f8fafc; }
    
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }
    .badge-warn { background: #fef3c7; color: #b45309; }
    .badge-success { background: #d1fae5; color: #047857; }
    .flex-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .status-text { font-size: 0.85rem; color: var(--text-muted); margin-top: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER SEKOLAH -->
    <div class="header-banner">
      <h1>SMP NEGERI 4 PRAYA</h1>
      <h2>UJIAN ONLINE ASTS</h2>
      <p>Mata Pelajaran Terpadu Tahun Pelajaran 2026/2027</p>
    </div>

    <!-- PANEL KONTROL GURU -->
    <div class="card">
      <h2 class="card-title"><i class="fa-solid fa-sliders"></i> Panel Kontrol Guru Ujian Online</h2>
      <div class="flex-row" style="margin-bottom: 20px;">
        <div class="form-group" style="flex: 1; margin-bottom:0;">
          <label>Atur Token Ujian Aktif</label>
          <input type="text" id="tokenInput" class="form-control" placeholder="Contoh: SMP99">
        </div>
        <button class="btn btn-primary" style="margin-top: 24px;" onclick="saveToken()"><i class="fa-solid fa-key"></i> Simpan Token</button>
      </div>
      <div class="flex-row" style="gap: 10px;">
        <button class="btn btn-info" onclick="fetchLiveResults()"><i class="fa-solid fa-rotate"></i> Muat Ulang Data (Sync Cloud)</button>
        <button class="btn btn-success" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> Unduh Rekap (.xls / Excel)</button>
      </div>
      <div id="statusText" class="status-text">Status: Siap memuat data...</div>
    </div>

    <!-- TABEL HASIL UJIAN SISWA -->
    <div class="card">
      <h2 class="card-title"><i class="fa-solid fa-chart-column"></i> Daftar Nilai & Hasil Ujian Siswa</h2>
      <div class="flex-row" style="margin-bottom: 15px;">
        <div style="flex:1;">
          <label style="font-size:0.85rem; font-weight:700; color:#334155;">Filter Kelas:</label>
          <select id="filterClass" class="form-control" onchange="renderTable()" style="margin-top:5px;">
            <option value="ALL">Semua Kelas</option>
            <option value="7.1">Kelas 7.1</option>
            <option value="7.2">Kelas 7.2</option>
            <option value="7.3">Kelas 7.3</option>
            <option value="8.1">Kelas 8.1</option>
            <option value="8.2">Kelas 8.2</option>
            <option value="9.1">Kelas 9.1</option>
            <option value="9.2">Kelas 9.2</option>
          </select>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table id="exportTable">
          <thead>
            <tr>
              <th>Waktu Kirim</th>
              <th>Nama Siswa</th>
              <th>Kelas</th>
              <th>Mapel</th>
              <th>Nilai PG</th>
              <th>Pelanggaran Tab</th>
              <th>Jawaban Essay</th>
            </tr>
          </thead>
          <tbody id="resultTableBody">
            <tr><td colspan="7" style="text-align:center; color:#94a3b8;">Belum ada data ujian yang masuk.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2yPgv48cRuIlC0z3clVN5CdBILpeAgSDEcVQcvTYk6jgLkaZionlRTJ9w6IGEfU5z/exec";

    let fetchedExamHistory = [];

    window.onload = function() {
      const activeToken = localStorage.getItem('activeExamToken') || "SMP99";
      document.getElementById('tokenInput').value = activeToken;
      fetchLiveResults();
    };

    function saveToken() {
      const newToken = document.getElementById('tokenInput').value.trim();
      if (!newToken) return alert("Token tidak boleh kosong!");
      localStorage.setItem('activeExamToken', newToken);
      alert(`Token ujian berhasil diubah menjadi: ${newToken}`);
    }

    function fetchLiveResults() {
      const statusEl = document.getElementById('statusText');
      
      if (!SCRIPT_URL || SCRIPT_URL === "https://script.google.com/macros/s/AKfycbw2yPgv48cRuIlC0z3clVN5CdBILpeAgSDEcVQcvTYk6jgLkaZionlRTJ9w6IGEfU5z/exec") {
        statusEl.innerText = "Status: URL Google Apps Script belum diatur!";
        return;
      }

      statusEl.innerText = "Status: Mengambil data terbaru dari Google Sheet...";

      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          fetchedExamHistory = data;
          renderTable();
          statusEl.innerText = `Status: Berhasil memperbarui data (${data.length} siswa ditemukan). Total diperbarui pada ${new Date().toLocaleTimeString('id-ID')}`;
        })
        .catch(err => {
          console.error(err);
          statusEl.innerText = "Status: Gagal mengambil data cloud.";
        });
    }

    function renderTable() {
      const tbody = document.getElementById('resultTableBody');
      const filterClass = document.getElementById('filterClass').value;
      let history = [...fetchedExamHistory];

      if (filterClass !== "ALL") {
        history = history.filter(item => item.class === filterClass);
      }

      if (history.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#94a3b8;">Belum ada data ujian yang masuk.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      history.forEach((item) => {
        const row = document.createElement('tr');
        
        let essayText = "";
        if (Array.isArray(item.essayAnswers) && item.essayAnswers.length > 0) {
          essayText = item.essayAnswers.join("<br>");
        } else if (typeof item.essayAnswers === 'string') {
          essayText = item.essayAnswers;
        } else {
          essayText = "Tidak ada jawaban essay.";
        }

        const violText = `${item.violations || 0}x Pindah Tab`;

        row.innerHTML = `
          <td>${item.time}</td>
          <td>${item.name}</td>
          <td>${item.class}</td>
          <td>${item.subject}</td>
          <td><b>${item.score}</b></td>
          <td>${violText}</td>
          <td>${essayText}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function exportToExcel() {
      const tableHTML = document.getElementById('exportTable').outerHTML.replace(/ /g, '%20');
      const filename = `Rekap_Nilai_Ujian_${new Date().toISOString().slice(0,10)}.xls`;
      
      const downloadLink = document.createElement('a');
      downloadLink.href = 'data:application/vnd.ms-excel,' + tableHTML;
      downloadLink.download = filename;
      
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }
  </script>
</body>
</html>
